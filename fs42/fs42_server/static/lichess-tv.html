<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lichess TV - CRT 4:3 Centered</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Lock body to full CRT resolution */
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #161512;
      color: #bababa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outer 4:3 frame wrapper */
    .crt-card {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vh 2vw;
      background: #161512;
    }

    /* Constrain board area so all 8 ranks fit inside the vertical screen space */
    .board-container {
      width: 82vh;
      height: 82vh;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      overflow: hidden;
    }

    .board-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="crt-card">
    <div class="board-container">
      <iframe
        src="https://lichess.org/tv/frame?theme=brown&bg=dark"
        allowtransparency="true"
        scrolling="no">
      </iframe>
    </div>
  </div>

</body>
</html>
